[project]
name = "agents-motion-simulation"
version = "1.0.0"
description = "基于自组织的多无人机均匀多边形编队仿真"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6",
    "numpy",
]

[project.scripts]
formation = "formation.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formation"]
